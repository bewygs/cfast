# Demo: build CFAST with several Fortran compilers and run the Verification cases on each push, PR or selected ref.
# Validation cases are run only when the tested ref changes their input files.
name: CFAST verification

on:
  # Branches are tested through their PR; a push trigger on every branch would run the matrix twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      refs:
        description: 'Space-separated refs to test: branch, tag, full 40-character SHA, or pr/N for an upstream firemodels/cfast PR'
        required: false
        default: ''
      upstream_prs:
        description: 'Also test the head of every open upstream PR'
        type: boolean
        default: false
  schedule:
    - cron: '0 5 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/firemodels/cfast

jobs:
  targets:
    name: Select refs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REFS: ${{ inputs.refs }}
          UPSTREAM_PRS: ${{ inputs.upstream_prs }}
          SHA: ${{ github.sha }}
          LABEL: ${{ github.head_ref || github.ref_name }}
        run: |
          rows=()
          add() { rows+=("$(jq -cn --arg ref "$1" --arg label "$2" '{ref: $ref, label: $label}')"); }
          case $EVENT in
            push|pull_request) add "$SHA" "$LABEL";;
            workflow_dispatch) for ref in $REFS; do
                                 case $ref in pr/*) add "$ref" "upstream #${ref#pr/}";; *) add "$ref" "$ref";; esac
                               done;;
          esac
          if [[ $EVENT == schedule || $UPSTREAM_PRS == true ]]; then
            for n in $(gh pr list -R firemodels/cfast --state open --json number --jq '.[].number'); do
              add "pr/$n" "upstream #$n"
            done
          fi
          [[ ${#rows[@]} -gt 0 ]] || { echo "::error::No refs to test"; exit 1; }
          echo "matrix=$(printf '%s\n' "${rows[@]}" | jq -cs .)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.target.label }} / ${{ matrix.config.name }}
    needs: targets
    runs-on: ubuntu-24.04
    container: ${{ matrix.config.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
        # parallel: concurrent cases (empty = nproc). shard: i/n slice of the case list.
        # bench entries only measure timing; their results are not counted in the summary.
        config:
          - { id: gfortran-ubuntu, name: 'gfortran (Ubuntu 24.04)', container: '', make: gnu_linux, fflags: '' }
          - { id: gfortran16-fedora, name: 'gfortran 16 (Fedora 44)', container: 'fedora:44', make: gnu_linux, fflags: '' }
          # Every uninitialized integer local starts at 1, so flags such as abort_vent read as set.
          # The debug value -999999 hides this kind of bug because the code tests for 1.
          - { id: gfortran-init1, name: 'gfortran -finit-integer=1', container: '', make: gnu_linux,
              fflags: '-O0 -finit-integer=1 $(GITINFOGNU)' }
          - { id: ifx, name: 'Intel ifx', container: '', make: intel_linux, fflags: '' }
          - { id: bench-sequential, name: 'bench: gfortran, 1 case at a time', container: '', make: gnu_linux, fflags: '',
              bench: true, parallel: '1' }
          - { id: bench-shard1, name: 'bench: gfortran, shard 1/2', container: '', make: gnu_linux, fflags: '',
              bench: true, shard: '1/2' }
          - { id: bench-shard2, name: 'bench: gfortran, shard 2/2', container: '', make: gnu_linux, fflags: '',
              bench: true, shard: '2/2' }
    env:
      CFAST_CI_PARALLEL: ${{ matrix.config.parallel }}
      CFAST_CI_SHARD: ${{ matrix.config.shard }}
    steps:
      - name: Start timer
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Fedora packages
        if: matrix.config.container != ''
        run: dnf install -y --setopt=install_weak_deps=False gcc-gfortran make git jq findutils diffutils which

      # The compiler is cached as a directory, as fortran-lang/setup-fortran does; apt only runs on a cache miss.
      - name: Prepare oneAPI directory
        if: matrix.config.id == 'ifx'
        run: sudo mkdir -p /opt/intel && sudo chown "$USER" /opt/intel

      - name: Restore oneAPI cache
        if: matrix.config.id == 'ifx'
        id: oneapi
        uses: actions/cache@v4
        with:
          path: /opt/intel/oneapi
          key: oneapi-fortran-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install Intel oneAPI Fortran
        if: matrix.config.id == 'ifx' && steps.oneapi.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends intel-oneapi-compiler-fortran

      - name: Check out CI scripts
        uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .github

      - name: Fetch tested ref
        env:
          REF: ${{ matrix.target.ref }}
        run: |
          git config --global --add safe.directory '*'
          git init -q src && cd src
          # Blobless fetch keeps the history needed to find the files changed since upstream master.
          case $REF in
            pr/*) git fetch -q --filter=blob:none "$UPSTREAM" "pull/${REF#pr/}/head";;
            *)    git fetch -q --filter=blob:none "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$REF" \
                    || git fetch -q --filter=blob:none "$UPSTREAM" "$REF";;
          esac
          git checkout -q FETCH_HEAD
          git fetch -q --filter=blob:none "$UPSTREAM" master:upstream-master
          echo "Testing $(git log -1 --format='%h %s')"
          echo "SETUP_S=$(( $(date +%s) - T0 ))" >> "$GITHUB_ENV"

      - name: Build CFAST
        working-directory: src/Build/CFAST/${{ matrix.config.make }}
        env:
          TARGET: ${{ matrix.config.make }}
          FFLAGS_OVERRIDE: ${{ matrix.config.fflags }}
        run: |
          [[ $TARGET != intel_linux ]] || source /opt/intel/oneapi/setvars.sh > /dev/null
          if [[ -z $FFLAGS_OVERRIDE ]]; then
            ./make_cfast.sh --clean-cfast
          else
            make -f ../makefile clean
            make -f ../makefile "$TARGET" FFLAGS="$FFLAGS_OVERRIDE"
          fi
          if [[ $TARGET == intel_linux ]]; then ifx --version | head -1; else gfortran --version | head -1; fi
          ls -l cfast8_linux
          echo "BUILD_S=$SECONDS" >> "$GITHUB_ENV"

      - name: Run Verification cases
        id: verification
        continue-on-error: true
        env:
          TARGET: ${{ matrix.config.make }}
        run: |
          [[ $TARGET != intel_linux ]] || source /opt/intel/oneapi/setvars.sh > /dev/null
          trap 'echo "VERIFICATION_S=$SECONDS" >> "$GITHUB_ENV"' EXIT
          echo "Running on $(nproc) CPUs"
          ci/.github/scripts/run_cfast_ci.sh src "src/Build/CFAST/$TARGET/cfast8_linux" Verification verification.tsv

      - name: Run changed Validation cases
        id: validation
        if: ${{ !matrix.config.bench }}
        continue-on-error: true
        env:
          TARGET: ${{ matrix.config.make }}
        run: |
          [[ $TARGET != intel_linux ]] || source /opt/intel/oneapi/setvars.sh > /dev/null
          trap 'echo "VALIDATION_S=$SECONDS" >> "$GITHUB_ENV"' EXIT
          cd src
          cases=$(git diff --name-only --diff-filter=AM "$(git merge-base HEAD upstream-master)" HEAD -- 'Validation/*.in' \
                  | sed 's#^Validation/##')
          cd ..
          if [[ -z $cases ]]; then echo 'No Validation inputs changed.'; : > validation.tsv; exit 0; fi
          # Changed inputs that are not listed in Validation/scripts/CFAST_Cases.sh are skipped.
          ci/.github/scripts/run_cfast_ci.sh src "src/Build/CFAST/$TARGET/cfast8_linux" Validation validation.tsv $cases

      - name: Save results
        if: always()
        env:
          LABEL: ${{ matrix.target.label }}
          CONFIG: ${{ matrix.config.name }}
          CONFIG_ID: ${{ matrix.config.id }}
          REF: ${{ matrix.target.ref }}
          BENCH: ${{ matrix.config.bench }}
          ONEAPI_CACHE: ${{ steps.oneapi.outputs.cache-hit }}
        run: |
          mkdir -p results timing
          name=$(printf '%s__%s' "$REF" "$CONFIG_ID" | tr -c 'A-Za-z0-9_.-' '_')
          sha=$(git -C src rev-parse --short HEAD 2> /dev/null || echo '?')
          ncases=$(cat verification.tsv validation.tsv 2> /dev/null | wc -l)
          note=; [[ $CONFIG_ID != ifx ]] || note=$([[ $ONEAPI_CACHE == true ]] && echo 'oneAPI from cache' || echo 'oneAPI from apt')
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$LABEL ($sha)" "$CONFIG" "${SETUP_S:-}" "${BUILD_S:-}" \
            "${VERIFICATION_S:-}" "${VALIDATION_S:-}" "$ncases" "$note" > "timing/$name.tsv"
          # Bench jobs repeat the gfortran-ubuntu cases, so only their timing is kept.
          [[ $BENCH != true ]] || exit 0
          for suite in verification validation; do
            [[ -f $suite.tsv ]] || continue
            awk -F'\t' -v OFS='\t' -v l="$LABEL ($sha)" -v c="$CONFIG" -v s="$suite" '{print l, c, s, $0}' $suite.tsv
          done > "results/$name.tsv"
          # Keep the logs of failed cases only.
          awk -F'\t' '$5 != 0 {print ($3 == "verification" ? "Verification/" : "Validation/") $4}' "results/$name.tsv" \
            | while read -r input; do
                for f in "src/${input%.*}".{log,err}; do [[ ! -f $f ]] || install -D "$f" "logs/${f#src/}"; done
              done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ strategy.job-index }}
          path: |
            results/
            timing/
            logs/
          if-no-files-found: ignore

      - name: Fail on case failures
        if: ${{ !matrix.config.bench && (steps.verification.outcome == 'failure' || steps.validation.outcome == 'failure') }}
        run: exit 1

  summary:
    name: Summary
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
      - name: Write summary table
        run: |
          cat results/*.tsv 2> /dev/null > all.tsv || true
          {
            echo '## CFAST cases'
            echo
            echo 'Passed/run per ref and compiler. Validation runs only the inputs changed by the ref.'
            echo
            awk -F'\t' '
              { key = $1 SUBSEP $2 SUBSEP $3; run[key]++; if ($5 == 0) ok[key]++
                if (!($1 in seenref)) { seenref[$1]; refs[++nr] = $1 }
                if (!($2 in seencfg)) { seencfg[$2]; cfgs[++nc] = $2 } }
              END {
                if (nr == 0) { print "No results."; exit }
                printf "| Ref | Suite |"; for (j = 1; j <= nc; j++) printf " %s |", cfgs[j]; print ""
                printf "|---|---|"; for (j = 1; j <= nc; j++) printf "---|"; print ""
                for (i = 1; i <= nr; i++) for (s = 1; s <= 2; s++) {
                  suite = (s == 1 ? "verification" : "validation"); line = ""; any = 0
                  for (j = 1; j <= nc; j++) {
                    key = refs[i] SUBSEP cfgs[j] SUBSEP suite
                    if (key in run) { any = 1; mark = (ok[key] == run[key] ? "✅" : "❌")
                      line = line sprintf(" %s %d/%d |", mark, ok[key] + 0, run[key]) }
                    else line = line " – |"
                  }
                  if (any) printf "| %s | %s |%s\n", refs[i], suite, line
                } }' all.tsv
            if awk -F'\t' '$5 != 0' all.tsv | grep -q .; then
              echo
              echo '<details><summary>Failed cases</summary>'
              echo
              echo '| Ref | Compiler | Case | Exit | Message |'
              echo '|---|---|---|---|---|'
              awk -F'\t' '$5 != 0 { gsub(/\|/, "\\|", $6); printf "| %s | %s | `%s` | %s | %s |\n", $1, $2, $4, $5, $6 }' all.tsv
              echo
              echo '</details>'
            fi
            echo
            echo '## Timing (seconds, inside the job)'
            echo
            echo 'Setup covers package or compiler install, checkout and fetch, but not the runner or container start;'
            echo 'see the job durations in the run for the full wall time.'
            echo
            echo '| Ref | Config | Setup | Build | Verification | Validation | Cases | Note |'
            echo '|---|---|---|---|---|---|---|---|'
            cat timing/*.tsv 2> /dev/null | sort -t$'\t' -k1,1 -k2,2 \
              | awk -F'\t' '{ printf "| %s | %s | %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, ($6 == "" ? "–" : $6), $7, $8 }'
          } >> "$GITHUB_STEP_SUMMARY"
