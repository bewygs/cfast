# Demo: build CFAST as it is distributed and run the Verification cases on each PR or selected ref.
# Validation cases are run only when the tested ref changes their input files.
name: CFAST verification

on:
  # Branches are tested through their PR; a push trigger on every branch would run the matrix twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      refs:
        description: 'Space-separated refs to test: branch, tag, full 40-character SHA, or pr/N for an upstream firemodels/cfast PR'
        required: false
        default: ''
      upstream_prs:
        description: 'Also test the head of every open upstream PR'
        type: boolean
        default: false
  schedule:
    - cron: '0 5 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/firemodels/cfast

jobs:
  targets:
    name: Select refs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REFS: ${{ inputs.refs }}
          UPSTREAM_PRS: ${{ inputs.upstream_prs }}
          SHA: ${{ github.sha }}
          LABEL: ${{ github.head_ref || github.ref_name }}
        run: |
          rows=()
          add() { rows+=("$(jq -cn --arg ref "$1" --arg label "$2" '{ref: $ref, label: $label}')"); }
          case $EVENT in
            push|pull_request) add "$SHA" "$LABEL";;
            workflow_dispatch) for ref in $REFS; do
                                 case $ref in pr/*) add "$ref" "upstream #${ref#pr/}";; *) add "$ref" "$ref";; esac
                               done;;
          esac
          if [[ $EVENT == schedule || $UPSTREAM_PRS == true ]]; then
            for n in $(gh pr list -R firemodels/cfast --state open --json number --jq '.[].number'); do
              add "pr/$n" "upstream #$n"
            done
          fi
          [[ ${#rows[@]} -gt 0 ]] || { echo "::error::No refs to test"; exit 1; }
          echo "matrix=$(printf '%s\n' "${rows[@]}" | jq -cs .)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.target.label }} / ${{ matrix.config.name }}
    needs: targets
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
        # The builds CFAST distributes (Build/bundle) or runs nightly (cfastbot), plus one check build.
        config:
          - { id: gnu-linux, name: 'Linux gfortran', os: ubuntu-24.04, make: gnu_linux, exe: cfast8_linux }
          # cfastbot makes the guide figures from its Linux Intel run, so the Verification plots come from this build.
          - { id: intel-linux, name: 'Linux Intel ifx', os: ubuntu-24.04, make: intel_linux, exe: cfast8_linux, plots: true }
          - { id: gnu-macos, name: 'macOS gfortran', os: macos-15, make: gnu_macos, exe: cfast8_macos }
          # Every uninitialized integer local starts at 1, so a flag that is never set reads as set.
          # The debug builds use -finit-integer=-999999, which hides flags tested against 1.
          - { id: uninit-check, name: 'gfortran uninitialized check', os: ubuntu-24.04, make: gnu_linux, exe: cfast8_linux,
              fflags: '-O0 -finit-integer=1 $(GITINFOGNU)' }
    steps:
      - name: Install Intel oneAPI Fortran
        if: matrix.config.make == 'intel_linux'
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update -q
          sudo apt-get install -y -q intel-oneapi-compiler-fortran

      # The makefile calls gfortran; the macOS runner only ships versioned Homebrew compilers.
      - name: Select gfortran on macOS
        if: runner.os == 'macOS'
        run: |
          fc=$(ls "$(brew --prefix)"/bin/gfortran-[0-9]* 2> /dev/null | sort -t- -k2 -n | tail -1)
          if [[ -z $fc ]]; then brew install gcc; fc=$(brew --prefix)/bin/gfortran; fi
          mkdir -p "$HOME/bin" && ln -sf "$fc" "$HOME/bin/gfortran"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check out CI scripts
        uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .github

      - name: Fetch tested ref
        env:
          REF: ${{ matrix.target.ref }}
        run: |
          git init -q cfast && cd cfast
          # Blobless fetch keeps the history needed to find the files changed since upstream master.
          case $REF in
            pr/*) git fetch -q --filter=blob:none "$UPSTREAM" "pull/${REF#pr/}/head";;
            *)    git fetch -q --filter=blob:none "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$REF" \
                    || git fetch -q --filter=blob:none "$UPSTREAM" "$REF";;
          esac
          git checkout -q FETCH_HEAD
          git fetch -q --filter=blob:none "$UPSTREAM" master:upstream-master
          echo "Testing $(git log -1 --format='%h %s')"

      - name: Build CFAST
        working-directory: cfast/Build/CFAST/${{ matrix.config.make }}
        env:
          TARGET: ${{ matrix.config.make }}
          FFLAGS_OVERRIDE: ${{ matrix.config.fflags }}
        run: |
          [[ $TARGET != intel_linux ]] || source /opt/intel/oneapi/setvars.sh > /dev/null
          if [[ -z $FFLAGS_OVERRIDE ]]; then
            ./make_cfast.sh --clean-cfast
          else
            make -f ../makefile clean
            make -f ../makefile "$TARGET" FFLAGS="$FFLAGS_OVERRIDE"
          fi
          if [[ $TARGET == intel_* ]]; then ifx --version | head -1; else gfortran --version | head -1; fi

      - name: Run Verification cases
        id: verification
        continue-on-error: true
        env:
          TARGET: ${{ matrix.config.make }}
          EXE: cfast/Build/CFAST/${{ matrix.config.make }}/${{ matrix.config.exe }}
        run: |
          [[ $TARGET != intel_linux ]] || source /opt/intel/oneapi/setvars.sh > /dev/null
          ci/.github/scripts/run_cfast_ci.sh cfast "$EXE" Verification verification.tsv

      - name: Run changed Validation cases
        id: validation
        continue-on-error: true
        env:
          TARGET: ${{ matrix.config.make }}
          EXE: cfast/Build/CFAST/${{ matrix.config.make }}/${{ matrix.config.exe }}
        run: |
          [[ $TARGET != intel_linux ]] || source /opt/intel/oneapi/setvars.sh > /dev/null
          cases=$(cd cfast && git diff --name-only --diff-filter=AM "$(git merge-base HEAD upstream-master)" HEAD \
                  -- 'Validation/*.in' | sed 's#^Validation/##')
          if [[ -z $cases ]]; then echo 'No Validation inputs changed.'; : > validation.tsv; exit 0; fi
          # Changed inputs that are not listed in Validation/scripts/CFAST_Cases.sh are skipped.
          ci/.github/scripts/run_cfast_ci.sh cfast "$EXE" Validation validation.tsv $cases

      # Same plotting script and Python environment as cfastbot stage 5; fdsplotlib comes from the fds repository.
      - name: Check out fdsplotlib
        if: matrix.config.plots
        uses: actions/checkout@v4
        with:
          repository: firemodels/fds
          path: fds
          sparse-checkout: Utilities/Python

      - uses: actions/setup-python@v5
        if: matrix.config.plots
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cfast/.github/requirements.txt

      - name: Make Verification plots
        id: plots
        if: matrix.config.plots
        continue-on-error: true
        shell: bash
        env:
          LABEL: ${{ matrix.target.label }}
        run: |
          source cfast/Utilities/CI/setup_python.sh
          setup_cfast_python "$GITHUB_WORKSPACE"
          (cd cfast/Utilities/Python && "$CFAST_PYTHON" CFAST_verification_script.py > plots.log 2>&1) || true
          # Report the error-tolerance check of every plotted quantity, as cfastbot's guides do.
          mkdir -p results
          report=results/tolerance-${{ strategy.job-index }}.md
          printf '### Verification tolerance: %s, ${{ matrix.config.name }}\n\n' "$LABEL" > "$report"
          "$CFAST_PYTHON" ci/.github/scripts/verification_tolerance.py cfast out-of-tolerance | tee -a "$report"

      - uses: actions/upload-artifact@v4
        if: matrix.config.plots && steps.plots.outcome != 'skipped'
        with:
          name: out-of-tolerance-figures-${{ strategy.job-index }}
          path: |
            out-of-tolerance/
            cfast/Utilities/Python/plots.log
          if-no-files-found: ignore

      - name: Save results
        if: always()
        env:
          LABEL: ${{ matrix.target.label }}
          CONFIG: ${{ matrix.config.name }}
          CONFIG_ID: ${{ matrix.config.id }}
          REF: ${{ matrix.target.ref }}
        run: |
          mkdir -p results logs
          name=$(printf '%s__%s' "$REF" "$CONFIG_ID" | tr -c 'A-Za-z0-9_.-' '_')
          sha=$(git -C cfast rev-parse --short HEAD 2> /dev/null || echo '?')
          for suite in verification validation; do
            [[ -f $suite.tsv ]] || continue
            awk -F'\t' -v OFS='\t' -v l="$LABEL ($sha)" -v c="$CONFIG" -v s="$suite" '{print l, c, s, $0}' $suite.tsv
          done > "results/$name.tsv"
          # Keep the logs of failed cases only.
          awk -F'\t' '$5 != 0 {print ($3 == "verification" ? "Verification/" : "Validation/") $4}' "results/$name.tsv" \
            | while read -r input; do
                for f in "cfast/${input%.*}.log" "cfast/${input%.*}.err"; do
                  [[ ! -f $f ]] || { mkdir -p "logs/$(dirname "${f#cfast/}")"; cp "$f" "logs/${f#cfast/}"; }
                done
              done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ strategy.job-index }}
          path: |
            results/
            logs/
          if-no-files-found: ignore

      - name: Fail on case failures
        if: steps.verification.outcome == 'failure' || steps.validation.outcome == 'failure' || steps.plots.outcome == 'failure'
        run: exit 1

  summary:
    name: Summary
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
      - name: Write report
        run: |
          cat results/*.tsv 2> /dev/null > all.tsv || true
          {
            echo '## CFAST verification'
            echo
            echo 'Cases passed/run per ref and build. Validation runs only the inputs changed by the ref.'
            echo
            awk -F'\t' '
              { key = $1 SUBSEP $2 SUBSEP $3; run[key]++; if ($5 == 0) ok[key]++
                if (!($1 in seenref)) { seenref[$1]; refs[++nr] = $1 }
                if (!($2 in seencfg)) { seencfg[$2]; cfgs[++nc] = $2 } }
              END {
                if (nr == 0) { print "No results."; exit }
                printf "| Ref | Suite |"; for (j = 1; j <= nc; j++) printf " %s |", cfgs[j]; print ""
                printf "|---|---|"; for (j = 1; j <= nc; j++) printf "---|"; print ""
                for (i = 1; i <= nr; i++) for (s = 1; s <= 2; s++) {
                  suite = (s == 1 ? "Verification" : "Validation"); line = ""; any = 0
                  for (j = 1; j <= nc; j++) {
                    key = refs[i] SUBSEP cfgs[j] SUBSEP tolower(suite)
                    if (key in run) { any = 1
                      line = line sprintf(" %d/%d%s |", ok[key] + 0, run[key], (ok[key] == run[key] ? "" : " failed")) }
                    else line = line " - |"
                  }
                  if (any) printf "| %s | %s |%s\n", refs[i], suite, line
                } }' all.tsv
            if awk -F'\t' '$5 != 0' all.tsv | grep -q .; then
              echo
              echo '<details><summary>Failed cases</summary>'
              echo
              echo '| Ref | Build | Case | Exit | Message |'
              echo '|---|---|---|---|---|'
              awk -F'\t' '$5 != 0 { gsub(/\|/, "\\|", $6); printf "| %s | %s | `%s` | %s | %s |\n", $1, $2, $4, $5, $6 }' all.tsv
              echo
              echo '</details>'
            fi
            for f in results/tolerance-*.md; do [[ ! -f $f ]] || { echo; cat "$f"; }; done
            echo
            echo "[Logs and figures]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated on each run, like coverage bots.
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- cfast-verification-report -->'
          body="$marker"$'\n'"$(cat report.md)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
          # A PR from another fork gets a read-only token; the report stays in the run summary.
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"
          fi || echo '::warning::Could not comment on the PR; see the run summary.'
